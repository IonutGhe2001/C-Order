services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=changeme_super_secret
      - JWT_HEADER=Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data

volumes:
  onlyoffice_data: